# DADA2 Snakemake Pipeline Configuration Template
#
# NOTE: In normal use you do NOT write this file by hand. `run_dada2processing`
# generates config.yaml in your output directory (including the sample list and
# the per-amplicon defaults below). This template documents every key it writes.

# ============================================================================
# REQUIRED PARAMETERS
# ============================================================================

# Amplicon type: 16S-V4, ITS1, ITS2, 18S-AMF, or 18S-V4
amplicon: "16S-V4"

# Sequencing platform: illumina or aviti
platform: "illumina"

# Sequence quality: good or bad
# "bad" makes some DADA2 filtering parameters (maxEE, and truncLen for ITS) more stringent
quality: "good"

# Path to directory containing the original demultiplexed FASTQ files
fastq_dir: "/path/to/fastq/directory"

# Path to output directory (will be created if it doesn't exist)
output_dir: "/path/to/output/directory"

# Project name (used in output filenames and README files)
project_name: "my_project"

# Email address for SLURM job notifications
email: "user@example.com"

# Sample list: a YAML list of sample names (a plain list only; a path to a sample file is not supported).
# Each sample needs <output_dir>/00_raw/<sample>_R1_001.fastq.gz and <sample>_R2_001.fastq.gz
# (or the same with _L001_ before R1/R2). run_dada2processing creates these as symlinks to fastq_dir.
samples:
  - sample_001
  - sample_002
  - sample_003

# ============================================================================
# OPTIONAL PARAMETERS (uncomment and customize as needed)
# ============================================================================

# Forward-reads-only mode: process single-end reads instead of paired-end
# Default: 0 (use paired-end). Set to 1 to process forward reads only.
# fwd_reads_only: "0"

# Skip OTU clustering and taxonomy assignment; only run DADA2 ASV denoising
# Default: 0 (run full pipeline). Set to 1 to skip OTU pipeline.
# skip_otu: "0"

# Run ITSx extraction to trim conserved flanking regions and drop non-ITS sequences (ITS1/ITS2 only)
# Default: 0 (off, preserves full-length ITS and synthetic mock community members). Set to 1 to enable.
# run_itsx: "0"

# OTU clustering identity threshold (range: 0.0-1.0)
# Default: 0.97 (97% identity OTUs)
# otu_cluster_id: "0.97"

# MUMU curation: BLAST identity threshold for merging OTUs (range: 0-100)
# Default: 94 for 16S-V4, 84 for all other amplicons
# (run_dada2processing sets this per amplicon; if you run snakemake directly the fallback is 84)
# mumu_blast_id: "84"

# MUMU curation: minimum parent/daughter abundance ratio for a merge (mumu --minimum_ratio)
# Higher = more conservative (fewer merges).
# Default: 100 for 16S-V4, 1 for all other amplicons
# (run_dada2processing sets this per amplicon; if you run snakemake directly the fallback is 1)
# mumu_ratio: "1"

# Override default taxonomy database for this amplicon
# Options: SILVA, UNITE, PR2, MaarjAM, EukaryomeSSU, EukaryomeITS
# Default: SILVA (16S-V4), UNITE (ITS1/ITS2), PR2 (18S-V4), MaarjAM (18S-AMF)
# taxonomy_db_override: "SILVA"

# Override forward primer sequence (use if default primers don't match your amplicon)
# Format: DNA sequence (A, T, G, C, R, Y, W, S, K, M, B, D, H, V, N supported)
# Default: amplicon-specific primers from workflow/config/primers.json
# fwd_primer_override: "GTGYCAGCMGCCGCGGTAA"

# Override reverse primer sequence
# Default: amplicon-specific primers from workflow/config/primers.json
# rev_primer_override: "GGACTACNVGGGTWTCTAAT"
